          <line x1="39" y1="98" x2="66" y2="78"/>
          <line x1="111" y1="99" x2="87" y2="79"/>
          <line x1="78" y1="113" x2="77" y2="84"/>
          <line x1="44" y1="45" x2="108" y2="40"/>
