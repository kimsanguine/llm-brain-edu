      <text x="205" y="14" fill="#74716a">OBSIDIAN</text>
    </g>
  </g>
  <line x1="56" y1="64" x2="1224" y2="64" stroke="#111111" stroke-width="0.7" stroke-opacity="0.18"/>

  <g transform="translate(56, 112)">
    <text class="display" x="0" y="58" font-size="70" letter-spacing="0" fill="#111111">llm-brain</text>
    <text class="display" x="3" y="112" font-size="25" font-style="italic" letter-spacing="0.7" fill="#7c3aed">AI-NATIVE SECOND BRAIN OS</text>
  </g>

  <g class="serif" font-size="18" fill="#111111">
    <text x="56" y="280">Turn raw notes into a living wiki.</text>
    <text x="56" y="306">Useful knowledge gets distilled; stale notes get archived.</text>
  </g>
  <g class="mono" font-size="11" letter-spacing="2.1" fill="#74716a">
    <text x="56" y="342">INGEST  /  DISTILL  /  GRAPH  /  LIFECYCLE  /  EXPRESS</text>
