<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="llm-brain AI-native second brain OS banner">
  <defs>
    <pattern id="paper-dot" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#111111" fill-opacity="0.065"/>
    </pattern>
    <pattern id="scanline" x="0" y="0" width="96" height="6" patternUnits="userSpaceOnUse">
      <rect width="28" height="3" fill="#111111"/>
      <rect x="36" y="3" width="18" height="3" fill="#7c3aed"/>
      <rect x="62" width="10" height="3" fill="#2563eb"/>
      <rect x="78" y="3" width="7" height="3" fill="#a78bfa"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .display { font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif; font-weight: 800; }
      .serif { font-family: "Source Serif 4", Georgia, serif; }
      .ink { stroke: #111111; fill: none; stroke-linejoin: miter; stroke-linecap: square; }
      .violet { stroke: #7c3aed; fill: none; stroke-linejoin: miter; stroke-linecap: square; }
      .blue { stroke: #2563eb; fill: none; stroke-linejoin: miter; stroke-linecap: square; }
      .ink-soft { fill: rgba(17, 17, 17, 0.045); }
      .violet-soft { fill: rgba(124, 58, 237, 0.08); }
      .blue-soft { fill: rgba(37, 99, 235, 0.07); }
    </style>
  </defs>

  <rect width="1280" height="420" fill="#fbfaf7"/>
  <rect width="1280" height="420" fill="url(#paper-dot)"/>

  <g class="mono" font-size="11" letter-spacing="2.2">
    <text x="56" y="44" fill="#7c3aed">FIG_LLM_BRAIN_00  /  LIVING KNOWLEDGE LIFECYCLE</text>
    <g transform="translate(984, 28)">
      <rect x="0" y="0" width="20" height="20" rx="5" fill="#111111"/>
      <text x="10" y="14" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#fbfaf7" letter-spacing="0">C</text>
      <text x="31" y="14" fill="#74716a">CLAUDE CODE</text>
      <text x="151" y="14" fill="#7c3aed">×</text>
      <g transform="translate(174, 0)">
