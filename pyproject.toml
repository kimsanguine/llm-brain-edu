[project]
name = "llm-wiki"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pymupdf>=1.24.0",
    "markdownify>=0.12.0",
    "beautifulsoup4>=4.12",   # 웹 기사 본문 추출(ingest --url)
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "anthropic>=0.40.0",
    "openai>=1.0",           # engine: openai (OpenAI API 및 OpenAI 호환 서버)
    "networkx>=3.0",
    "numpy>=1.26",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
# 스캔본·이미지 PDF 글자 인식(OCR). 기본 설치에는 들어가지 않는다: `uv sync --extra ocr`
# Tesseract 프로그램(맥: brew install tesseract tesseract-lang)도 따로 설치해야 한다.
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
